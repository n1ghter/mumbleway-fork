name: team-build

# Field-test builds for a riding group, from the fork's `team-build` branch:
# every open fix merged together, gated by tests and cargo-deny, built for
# Android, Windows and macOS, and put on a pre-release so testers download by
# link without a GitHub account.
#
# Nothing here uploads to a store, and nothing runs on `main` — `build.yml` and
# `publish.yml` are untouched and keep their own triggers. The steps mirror
# `build.yml` for the same checks and platforms; read the comments there.

on:
  push:
    branches: [team-build]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only unless a job asks for more (`release` alone takes `contents: write`).
permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.8'
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

jobs:
  # ---------------------------------------------------------------------------
  # Engine, FFI, cargokit, encoding/listing and UI tests. Gates platform builds.
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Every action is pinned to a commit, and Rust to a release
        run: |
          bad=$(grep -nE '^\s*(- )?uses:' .github/workflows/*.yml \
                | grep -vE 'uses: *\./' \
                | grep -vE '@[0-9a-f]{40}( |$)' || true)
          if [ -n "$bad" ]; then
            echo "::error::actions referenced by tag or branch, not by commit:"
            echo "$bad"
            exit 1
          fi
          # The pattern is split so that this line does not match itself.
          if grep -nE 'dtolnay/rust''-toolchain|rustup (default|toolchain install) +''stable' .github/workflows/*.yml; then
            echo "::error::the toolchain comes from rust-toolchain.toml, not from a floating channel"
            exit 1
          fi
          grep -qE '^channel = "[0-9]+\.[0-9]+\.[0-9]+"$' rust-toolchain.toml \
            || { echo "::error::rust-toolchain.toml must name an exact release"; exit 1; }

      - name: Rust toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install && rustup default "$(rustup show active-toolchain | cut -d' ' -f1)"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            core -> target
            app/rust -> target

      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install ALSA development headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Every file the Xcode project references exists
        run: |
          missing=0
          for plat in ios macos; do
            tracked=$(git ls-files "app/$plat" | sed 's|.*/||' | sort -u)
            refs=$(grep -oE 'path = [A-Za-z0-9_.+-]+\.(swift|m|h|plist|entitlements)' "app/$plat/Runner.xcodeproj/project.pbxproj" | sed 's/path = //' | sort -u)
            for f in $refs; do
              case "$f" in Generated*) continue ;; esac
              if ! echo "$tracked" | grep -qxF "$f"; then
                echo "::error::app/$plat/Runner.xcodeproj/project.pbxproj references $f, which is not in the repository"
                missing=1
              fi
            done
          done
          exit $missing

      - name: Check UTF-8 encoding
        run: python3 tool/check_encoding.py

      - name: Check store listing limits
        run: python3 tool/check_listing.py

      - name: Check formatting
        working-directory: core
        run: cargo fmt --check

      - name: Clippy
        working-directory: core
        run: cargo clippy --all-targets -- -D warnings

      - name: Engine tests
        working-directory: core
        run: cargo test

      - name: Clippy (app/rust)
        working-directory: app/rust
        run: cargo clippy --all-targets -- -D warnings

      - name: FFI tests
        working-directory: app/rust
        run: cargo test

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cargokit build_tool tests
        working-directory: app/rust_builder/cargokit/build_tool
        run: |
          dart pub get
          dart analyze
          dart test -c source

      - name: Resolve Dart dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Widget tests
        working-directory: app
        run: flutter test

  # ---------------------------------------------------------------------------
  # Dependency licences, sources and advisories (cargo-deny, config in deny.toml)
  # ---------------------------------------------------------------------------
  deny:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-latest
    env:
      CARGO_DENY_VERSION: '0.20.2'
      CARGO_DENY_SHA256: '9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Rust toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install && rustup default "$(rustup show active-toolchain | cut -d' ' -f1)"

      - name: Install cargo-deny
        run: |
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -sSLf -o "$RUNNER_TEMP/deny.tgz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${name}.tar.gz"
          echo "${CARGO_DENY_SHA256}  $RUNNER_TEMP/deny.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/deny.tgz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/${name}/cargo-deny" "$HOME/.cargo/bin/cargo-deny"

      - name: Licences, sources and bans
        run: |
          for crate in core app/rust; do
            echo "::group::$crate"
            cargo deny --manifest-path "$crate/Cargo.toml" --config deny.toml check licenses bans sources
            echo "::endgroup::"
          done

      - name: Advisories (reported, not enforced)
        continue-on-error: true
        run: |
          status=0
          for crate in core app/rust; do
            echo "::group::$crate"
            cargo deny --manifest-path "$crate/Cargo.toml" --config deny.toml check advisories || status=1
            echo "::endgroup::"
          done
          [ $status -eq 0 ] || echo "::warning::cargo-deny found advisories; see the log above"
          exit $status

  # ---------------------------------------------------------------------------
  # Android universal APK (team build applicationId)
  # ---------------------------------------------------------------------------
  android:
    name: Android APK
    needs: [test, deny]
    runs-on: ubuntu-latest
    env:
      # Gives the APK the id `com.mumbleway.mumbleway.team`, so it installs
      # beside a store build instead of failing over the signature.
      MUMBLEWAY_TEAM_BUILD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install && rustup default "$(rustup show active-toolchain | cut -d' ' -f1)"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: 'app/rust -> target'
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      # **One debug key across runs.** With no upload key the release APK is
      # debug-signed, and a fresh runner makes a fresh debug key — so every
      # build would refuse to install over the last one until the tester
      # uninstalled, losing their servers. The cache keeps the key stable for as
      # long as it is used at least once a week.
      - name: Keep the signing key between builds
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.android/debug.keystore
          key: team-build-debug-keystore-v1

      - name: Add Android Rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          # One universal APK for both phone ABIs, so testers pick no file.
          # SEVERE means the Rust library did not build and a stale one was
          # packaged — see build.yml and CLAUDE.md.
          flutter build apk --release --target-platform android-arm,android-arm64 2>&1 | tee build.log
          if grep -q 'SEVERE' build.log; then
            echo '::error::cargokit reported SEVERE'
            grep -n 'SEVERE' build.log | head -20
            exit 1
          fi
          cp build/app/outputs/flutter-apk/app-release.apk ../mumbleway-team.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mumbleway-team-android
          path: mumbleway-team.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows x64
  # ---------------------------------------------------------------------------
  windows:
    name: Windows x64
    needs: [test, deny]
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install && rustup default "$(rustup show active-toolchain | cut -d' ' -f1)"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: 'app/rust -> target'
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Ninja
        run: choco install ninja -y --no-progress
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      # Build the engine directly first so compiler errors surface cleanly
      # rather than being swallowed by MSBuild.
      - name: Build engine
        working-directory: app/rust
        run: cargo build --release

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # cargokit.cmake redirects CARGOKIT_TEMP_DIR under %LOCALAPPDATA%\cargokit\<hash>,
      # keeping nested libopus CMake compiler probes well below MAX_PATH without
      # copying the repository out of $GITHUB_WORKSPACE.
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release

      - name: Package
        working-directory: app/build/windows/x64/runner/Release
        run: 7z a -tzip "$env:GITHUB_WORKSPACE\mumbleway-team-windows-x64.zip" .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mumbleway-team-windows
          path: mumbleway-team-windows-x64.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # macOS desktop
  # ---------------------------------------------------------------------------
  macos:
    name: macOS
    needs: [test, deny]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install && rustup default "$(rustup show active-toolchain | cut -d' ' -f1)"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: 'app/rust -> target'
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build engine
        working-directory: app/rust
        env:
          MACOSX_DEPLOYMENT_TARGET: '10.15'
        run: cargo build --release

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build macos --release

      - name: Package
        working-directory: app/build/macos/Build/Products/Release
        run: ditto -c -k --sequesterRsrc --keepParent mumbleway.app "$GITHUB_WORKSPACE/mumbleway-team-macos.zip"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mumbleway-team-macos
          path: mumbleway-team-macos.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Pre-release for testers
  # ---------------------------------------------------------------------------
  release:
    name: Pre-release
    needs: [android, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      # A `team-` tag, never `v*`: `publish.yml` runs on `v*` and uploads to
      # the stores.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: team-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Team test build ${{ github.run_number }}
          prerelease: true
          make_latest: false
          body: |
            Test build for field testing, from branch `team-build` at ${{ github.sha }}.
            Not a release. Android: install `mumbleway-team.apk` (installs beside the store app).
            Windows: unzip and run `mumbleway.exe`.
            macOS: unzip, then `xattr -cr mumbleway.app` once (the build is not notarised).
          files: |
            dist/mumbleway-team.apk
            dist/mumbleway-team-windows-x64.zip
            dist/mumbleway-team-macos.zip
          fail_on_unmatched_files: true
